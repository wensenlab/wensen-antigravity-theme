<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 840" width="100%" height="100%">
  <defs>
    <style>
      .font-ui { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
      .font-serif { font-family: "Tiempos Text", Georgia, "Songti SC", "STSong", serif; }
      .font-mono { font-family: "SFMono-Regular", Consolas, "Sarasa Mono Slab SC", monospace; }
      .shadow { filter: drop-shadow(0 20px 50px rgba(0,0,0,0.18)) drop-shadow(0 0 1px rgba(0,0,0,0.15)); }
    </style>
    <filter id="win-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#000" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Window Container -->
  <g filter="url(#win-shadow)">
    <rect x="10" y="10" width="1300" height="820" rx="12" fill="#FCFCFB" stroke="rgba(0,0,0,0.15)" stroke-width="1" />
  </g>

  <clipPath id="window-clip">
    <rect x="10" y="10" width="1300" height="820" rx="12" />
  </clipPath>

  <g clip-path="url(#window-clip)">
    <!-- Window Titlebar -->
    <rect x="10" y="10" width="1300" height="42" fill="#F7F5F0" />
    <line x1="10" y1="52" x2="1310" y2="52" stroke="rgba(0,0,0,0.12)" stroke-width="1" />

    <!-- macOS Traffic Lights -->
    <circle cx="32" cy="31" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.8" />
    <circle cx="52" cy="31" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.8" />
    <circle cx="72" cy="31" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.8" />

    <!-- Window Centered Title -->
    <text x="615" y="36" class="font-ui" font-size="13" font-weight="550" fill="#383533" text-anchor="middle">Antigravity</text>
    <rect x="660" y="21" width="125" height="20" rx="4" fill="#ECE9E1" stroke="rgba(0,0,0,0.15)" stroke-width="1" />
    <text x="722" y="35" class="font-ui" font-size="11" font-weight="600" fill="#0A0A0A" text-anchor="middle">高对比版 · 全界面汉化</text>

    <!-- LEFT SIDEBAR: 燕麦暖色 #F7F5F0 -->
    <g id="sidebar">
      <rect x="10" y="52" width="240" height="778" fill="#F7F5F0" />
      <line x1="250" y1="52" x2="250" y2="830" stroke="rgba(0,0,0,0.12)" stroke-width="1" />

      <!-- New Chat Button -->
      <rect x="22" y="66" width="216" height="34" rx="6" fill="#ECE9E1" stroke="rgba(0,0,0,0.22)" stroke-width="1" />
      <text x="36" y="88" class="font-ui" font-size="13" font-weight="600" fill="#0A0A0A">新建对话</text>
      <text x="222" y="89" class="font-ui" font-size="15" font-weight="600" fill="#0A0A0A" text-anchor="end">＋</text>

      <!-- Section: Pinned -->
      <text x="24" y="126" class="font-ui" font-size="11" font-weight="600" fill="#7A7670" letter-spacing="0.04em">置顶对话</text>
      <!-- Active Conversation Item -->
      <rect x="18" y="136" width="224" height="32" rx="5" fill="#ECE9E1" stroke="rgba(0,0,0,0.18)" stroke-width="1" />
      <text x="30" y="157" class="font-ui" font-size="12.5" font-weight="600" fill="#0A0A0A">📌 智能座舱品牌定位推演</text>

      <!-- Section: Recent -->
      <text x="24" y="196" class="font-ui" font-size="11" font-weight="600" fill="#7A7670" letter-spacing="0.04em">最近会话</text>
      <g transform="translate(18, 206)">
        <text x="12" y="18" class="font-ui" font-size="12.5" font-weight="480" fill="#262422">💬 小红书爆款图文观点拆解</text>
        <text x="12" y="46" class="font-ui" font-size="12.5" font-weight="480" fill="#262422">🛠️ Agent Skills 架构设计</text>
        <text x="12" y="74" class="font-ui" font-size="12.5" font-weight="480" fill="#262422">📊 Q4 营销战役结案战报</text>
      </g>

      <!-- Section: Core Workspaces -->
      <text x="24" y="322" class="font-ui" font-size="11" font-weight="600" fill="#7A7670" letter-spacing="0.04em">核心工作区</text>
      <g transform="translate(18, 332)">
        <text x="12" y="18" class="font-ui" font-size="12.5" font-weight="480" fill="#262422">📁 项目管理 (Projects)</text>
        <text x="12" y="46" class="font-ui" font-size="12.5" font-weight="480" fill="#262422">⚙️ 自动化任务 (Automations)</text>
        <text x="12" y="74" class="font-ui" font-size="12.5" font-weight="480" fill="#262422">🧩 技能与自定义 (Skills)</text>
      </g>

