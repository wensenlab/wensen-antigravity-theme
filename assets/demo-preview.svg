        <rect x="116" y="6" width="130" height="18" rx="3" fill="#F4F0EB" stroke="rgba(0,0,0,0.14)" stroke-width="1" />
        <text x="181" y="19" class="font-ui" font-size="10.5" font-weight="600" fill="#0A0A0A" text-anchor="middle">brand-strategy-analyst</text>
        <text x="256" y="17" class="font-ui" font-size="11.5" font-weight="500" fill="#7A7670">刚才</text>

