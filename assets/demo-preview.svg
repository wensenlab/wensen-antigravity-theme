        <text x="16" y="30" class="font-ui" font-size="13.5" font-weight="450" fill="#1F1E1D">请帮我把上述核心价值主张，进一步细化为三套不同媒介渠道的整合营销战役大纲...</text>
        
        <line x1="12" y1="60" x2="748" y2="60" stroke="rgba(0,0,0,0.08)" stroke-width="1" />
        
        <!-- Input Tools -->
        <g transform="translate(14, 68)">
          <rect x="0" y="0" width="72" height="22" rx="4" fill="#ECE9E1" stroke="rgba(0,0,0,0.15)" stroke-width="1" />
          <text x="36" y="15" class="font-ui" font-size="11" font-weight="500" fill="#383533" text-anchor="middle">📎 附加资料</text>

          <rect x="78" y="0" width="112" height="22" rx="4" fill="#ECE9E1" stroke="rgba(0,0,0,0.15)" stroke-width="1" />
          <text x="134" y="15" class="font-ui" font-size="11" font-weight="500" fill="#383533" text-anchor="middle">🌐 联网检索: 已就绪</text>

          <rect x="196" y="0" width="68" height="22" rx="4" fill="#ECE9E1" stroke="rgba(0,0,0,0.15)" stroke-width="1" />
          <text x="230" y="15" class="font-ui" font-size="11" font-weight="500" fill="#383533" text-anchor="middle">⚡ 极速执行</text>
        </g>

        <!-- Model indicator & send button -->
