    <!-- RIGHT AUXILIARY PANE: 250px -->
    <g id="aux-pane">
      <rect x="1060" y="52" width="250" height="778" fill="#F7F5F0" />
      <line x1="1060" y1="52" x2="1060" y2="830" stroke="rgba(0,0,0,0.12)" stroke-width="1" />

      <!-- Header -->
      <text x="1076" y="78" class="font-ui" font-size="12.5" font-weight="650" fill="#0A0A0A">后台任务 (2)</text>
      <circle cx="1256" cy="74" r="3.5" fill="#27C93F" />
      <text x="1265" y="78" class="font-ui" font-size="11" font-weight="600" fill="#27C93F">运行中</text>
      <line x1="1074" y1="88" x2="1296" y2="88" stroke="rgba(0,0,0,0.1)" stroke-width="1" />

      <!-- Task Card 1 -->
      <g transform="translate(1074, 98)">
        <rect x="0" y="0" width="222" height="66" rx="6" fill="#FFF" stroke="rgba(0,0,0,0.18)" stroke-width="1" />
        <text x="12" y="20" class="font-ui" font-size="12" font-weight="650" fill="#1F1E1D">✓ 竞品攻防知识库检索</text>
        <text x="12" y="38" class="font-ui" font-size="11" fill="#7A7670">检索 6 份智驾座舱行业研报</text>
        <text x="12" y="54" class="font-ui" font-size="11" font-weight="600" fill="#27C93F">已完成 · 耗时 0.6s</text>
      </g>

      <!-- Task Card 2 -->
      <g transform="translate(1074, 172)">
        <rect x="0" y="0" width="222" height="66" rx="6" fill="#FFF" stroke="rgba(0,0,0,0.18)" stroke-width="1" />
        <text x="12" y="20" class="font-ui" font-size="12" font-weight="650" fill="#1F1E1D">⏳ 策略定位四象限推演</text>
        <text x="12" y="38" class="font-ui" font-size="11" fill="#7A7670">调用 brand-strategy-analyst</text>
        <text x="12" y="54" class="font-ui" font-size="11" font-weight="600" fill="#D97757">生成中 85%</text>
      </g>

      <!-- Deliverables Section -->
      <text x="1076" y="265" class="font-ui" font-size="10.5" font-weight="650" fill="#7A7670" letter-spacing="0.04em">交付工作清单 (DELIVERABLES)</text>
      
      <g transform="translate(1074, 276)">
        <rect x="0" y="0" width="222" height="32" rx="4" fill="#ECE9E1" stroke="rgba(0,0,0,0.15)" stroke-width="1" />
        <text x="12" y="20" class="font-ui" font-size="12" font-weight="500" fill="#262422">📄 smart-cockpit-strategy.md</text>
