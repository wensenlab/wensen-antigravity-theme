<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 880" width="100%" height="100%">
  <defs>
    <style>
      .font-ui { font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .font-serif { font-family: "Songti SC", "STSong", "Tiempos Text", Georgia, serif; }
      .font-mono { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace; }
    </style>
    <filter id="win-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Window Container with High Contrast Border -->
  <g filter="url(#win-shadow)">
    <rect x="15" y="15" width="1330" height="850" rx="12" fill="#FCFCFB" stroke="rgba(0,0,0,0.22)" stroke-width="1" />
  </g>

  <clipPath id="window-clip">
    <rect x="15" y="15" width="1330" height="850" rx="12" />
  </clipPath>

  <g clip-path="url(#window-clip)">
    <!-- ========================================== -->
    <!-- 1. Window Top Titlebar                     -->
    <!-- ========================================== -->
    <rect x="15" y="15" width="1330" height="42" fill="#F7F5F0" />
    <line x1="15" y1="57" x2="1345" y2="57" stroke="rgba(0,0,0,0.14)" stroke-width="1" />

    <!-- macOS Traffic Lights -->
    <circle cx="38" cy="36" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.8" />
    <circle cx="58" cy="36" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.8" />
    <circle cx="78" cy="36" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.8" />

    <!-- Center Badges -->
    <g transform="translate(520, 26)">
      <text x="0" y="14" class="font-ui" font-size="13" font-weight="600" fill="#383533">Antigravity</text>
      <rect x="76" y="0" width="56" height="20" rx="3" fill="rgba(0,0,0,0.06)" stroke="rgba(0,0,0,0.12)" stroke-width="0.8" />
      <text x="104" y="14" class="font-ui" font-size="11" font-weight="600" fill="#6A6660" text-anchor="middle">v2.31.0</text>
      <rect x="140" y="0" width="138" height="20" rx="4" fill="#ECE9E1" stroke="rgba(0,0,0,0.22)" stroke-width="1" />
      <text x="209" y="14" class="font-ui" font-size="11" font-weight="600" fill="#0A0A0A" text-anchor="middle">高对比版 · 全界面汉化</text>
    </g>

    <!-- ========================================== -->
    <!-- 2. LEFT SIDEBAR (燕麦暖色 #F7F5F0)         -->
    <!-- 1:1 严格还原官方真实截图标头与菜单布局     -->
    <!-- ========================================== -->
    <g id="sidebar">
      <rect x="15" y="57" width="245" height="808" fill="#F7F5F0" />
      <line x1="260" y1="57" x2="260" y2="865" stroke="rgba(0,0,0,0.14)" stroke-width="1" />

      <!-- Brand Header: ▲ Antigravity + Toggle Button ◫ -->
      <g transform="translate(32, 75)">
        <text x="0" y="16" class="font-ui" font-size="13" font-weight="700" fill="#1F1E1D">▲</text>
        <text x="18" y="16" class="font-ui" font-size="14" font-weight="700" fill="#1F1E1D" letter-spacing="-0.01em">Antigravity</text>
        <!-- Sidebar Collapse Icon -->
        <rect x="196" y="2" width="18" height="15" rx="3" fill="transparent" stroke="rgba(0,0,0,0.45)" stroke-width="1.2" />
        <line x1="202" y1="2" x2="202" y2="17" stroke="rgba(0,0,0,0.45)" stroke-width="1.2" />
      </g>

      <!-- + New Conversation (新建对话 卡片按钮) -->
      <g transform="translate(28, 108)">
        <rect x="0" y="0" width="218" height="34" rx="6" fill="#ECE9E1" stroke="rgba(0,0,0,0.28)" stroke-width="1" />
        <text x="14" y="22" class="font-ui" font-size="13" font-weight="600" fill="#0A0A0A">＋ 新建对话</text>
      </g>

      <!-- Primary Navigation Links (真实汉化) -->
      <g transform="translate(32, 162)">
        <!-- 历史对话 (Conversation History) -->
        <g transform="translate(0, 0)">
          <text x="0" y="14" class="font-ui" font-size="13" fill="#383533">🕒</text>
          <text x="22" y="14" class="font-ui" font-size="13" font-weight="500" fill="#262422">历史对话</text>
        </g>
        <!-- 技能与自定义 (Customizations) -->
        <g transform="translate(0, 32)">
          <text x="0" y="14" class="font-ui" font-size="13" fill="#383533">🎛️</text>
          <text x="22" y="14" class="font-ui" font-size="13" font-weight="500" fill="#262422">技能与自定义</text>
        </g>
        <!-- 远程控制 (Remote Control) -->
        <g transform="translate(0, 64)">
          <text x="0" y="14" class="font-ui" font-size="13" fill="#383533">📡</text>
          <text x="22" y="14" class="font-ui" font-size="13" font-weight="500" fill="#262422">远程控制</text>
        </g>
      </g>

      <!-- Projects Section (项目管理) -->
      <g transform="translate(28, 280)">
        <text x="4" y="0" class="font-ui" font-size="11.5" font-weight="650" fill="#7A7670" letter-spacing="0.04em">项目管理</text>
        <!-- Action Icons (Filter & Folder) -->
        <g transform="translate(182, -10)">
          <text x="0" y="10" class="font-ui" font-size="11" fill="#7A7670">▼</text>
          <rect x="18" y="0" width="14" height="12" rx="2" fill="transparent" stroke="#7A7670" stroke-width="1" />
        </g>

        <!-- Project item -->
        <g transform="translate(4, 16)">
          <text x="0" y="16" class="font-ui" font-size="12" font-weight="500" fill="#262422">📁 WenSenLab 创作者工坊</text>
        </g>
      </g>

      <!-- Conversations Section (会话列表) -->
      <g transform="translate(28, 345)">
        <text x="4" y="0" class="font-ui" font-size="11.5" font-weight="650" fill="#7A7670" letter-spacing="0.04em">会话列表</text>
        <text x="206" y="0" class="font-ui" font-size="13" font-weight="600" fill="#7A7670">＋</text>

        <!-- Active Conversation Row (高对比选中态) -->
        <g transform="translate(0, 10)">
          <rect x="0" y="0" width="218" height="34" rx="6" fill="#ECE9E1" stroke="rgba(0,0,0,0.32)" stroke-width="1" />
          <text x="10" y="21" class="font-ui" font-size="12.5" font-weight="600" fill="#0A0A0A">高端智能座舱交互策略...</text>
          <text x="204" y="21" class="font-ui" font-size="11" font-weight="500" fill="#7A7670" text-anchor="end">刚才</text>
        </g>

        <!-- Recent Conversation items -->
        <g transform="translate(10, 64)">
          <text x="0" y="14" class="font-ui" font-size="12.5" font-weight="480" fill="#383533">小红书爆款图文观点拆解</text>
          <text x="0" y="42" class="font-ui" font-size="12.5" font-weight="480" fill="#383533">文森策年度自媒体选题规划</text>
          <text x="0" y="70" class="font-ui" font-size="12.5" font-weight="480" fill="#383533">Agent Skills 架构设计与评测</text>
        </g>
      </g>

      <!-- Sidebar Footer (严格还原截图：Remote Conversations + Settings) -->
      <g transform="translate(28, 775)">
        <line x1="0" y1="0" x2="218" y2="0" stroke="rgba(0,0,0,0.12)" stroke-width="1" />
        
        <!-- 远程会话 (Remote Conversations) -->
        <g transform="translate(4, 18)">
          <text x="0" y="14" class="font-ui" font-size="13" fill="#383533">☁</text>
          <text x="20" y="14" class="font-ui" font-size="12.5" font-weight="500" fill="#262422">远程会话</text>
          <text x="200" y="14" class="font-ui" font-size="10" fill="#7A7670" text-anchor="end">˅</text>
        </g>

        <!-- 系统设置 (Settings) -->
        <g transform="translate(4, 50)">
          <text x="0" y="14" class="font-ui" font-size="13" fill="#383533">⚙</text>
          <text x="20" y="14" class="font-ui" font-size="12.5" font-weight="500" fill="#262422">系统设置</text>
          <text x="200" y="14" class="font-ui" font-size="11" font-weight="500" fill="#7A7670" text-anchor="end">WenSenLab</text>
        </g>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 3. MAIN WORKSPACE (微暖净白 #FCFCFB)       -->
    <!-- 严格还原截图的主工作区、消息流与输入框     -->
    <!-- ========================================== -->
    <g id="main-area">
      <!-- Top Conversation Header -->
      <rect x="260" y="57" width="1085" height="46" fill="#FCFCFB" />
      <line x1="260" y1="103" x2="1345" y2="103" stroke="rgba(0,0,0,0.08)" stroke-width="1" />

      <!-- Conversation Title -->
      <text x="290" y="86" class="font-ui" font-size="14.5" font-weight="650" fill="#1F1E1D">高端智能座舱交互美学与品牌策略推演</text>
      
      <!-- Top Right Window Actions (⋮ and ◫) -->
      <g transform="translate(1290, 75)">
        <text x="0" y="12" class="font-ui" font-size="14" font-weight="700" fill="#7A7670">⋮</text>
        <rect x="18" y="0" width="18" height="15" rx="3" fill="transparent" stroke="rgba(0,0,0,0.4)" stroke-width="1.2" />
        <line x1="24" y1="0" x2="24" y2="15" stroke="rgba(0,0,0,0.4)" stroke-width="1.2" />
      </g>

      <!-- ========================================== -->
      <!-- Message Stream                             -->
      <!-- ========================================== -->
      
      <!-- User Message Bubble (严格还原截图中的圆角卡片) -->
      <g transform="translate(420, 120)">
        <rect x="0" y="0" width="870" height="42" rx="8" fill="#F7F5F0" stroke="rgba(0,0,0,0.18)" stroke-width="1" />
        <text x="18" y="26" class="font-ui" font-size="13.5" font-weight="480" fill="#1F1E1D">针对豪华新能源智能座舱的 HMI 交互设计，请从人文审美、动态降维与品牌心智三个维度推导核心策略。</text>
      </g>

      <!-- Agent Response Area -->
      <g transform="translate(420, 180)">
        <!-- Execution Status Pill: Worked for 14s > ➔ 汉化: 已完成多维策略推演 · 耗时 12s ˃ -->
        <g transform="translate(0, 0)">
          <text x="0" y="14" class="font-ui" font-size="12.5" font-weight="500" fill="#7A7670">已完成多维策略推演 · 耗时 12s ˃</text>
        </g>

        <!-- Response Body Text -->
        <text x="0" y="44" class="font-serif" font-size="13.5" fill="#2C2B29">已完成豪华新能源座舱人机交互的系统化推导，核心设计原则与心智落点矩阵如下：</text>

        <!-- Section Heading: ■ 交互策略与心智落点矩阵 -->
        <g transform="translate(0, 72)">
          <rect x="0" y="3" width="9" height="9" fill="#1F1E1D" />
          <text x="16" y="12" class="font-ui" font-size="13.5" font-weight="700" fill="#0A0A0A">交互策略与心智落点矩阵</text>
        </g>

        <!-- Table (1:1 还原截图中的配置表格，融入 Solid Ink 高对比边框) -->
        <g transform="translate(0, 96)">
          <rect x="0" y="0" width="870" height="236" rx="6" fill="#FFF" stroke="rgba(0,0,0,0.24)" stroke-width="1" />
          
          <!-- Table Header -->
          <rect x="0" y="0" width="870" height="34" rx="6" fill="#F7F5F0" />
          <line x1="0" y1="34" x2="870" y2="34" stroke="rgba(0,0,0,0.14)" stroke-width="1" />
          <text x="18" y="22" class="font-ui" font-size="12.5" font-weight="650" fill="#0A0A0A">策略维度</text>
          <text x="190" y="22" class="font-ui" font-size="12.5" font-weight="650" fill="#0A0A0A">推导结论与体验设计落点</text>

          <!-- Row 1: 人文审美 -->
          <line x1="0" y1="68" x2="870" y2="68" stroke="rgba(0,0,0,0.08)" stroke-width="1" />
          <text x="18" y="54" class="font-ui" font-size="12.5" font-weight="600" fill="#262422">人文知性审美</text>
          <text x="190" y="54" class="font-serif" font-size="12.5" fill="#0A0A0A">摒弃冰冷参数堆砌，引入自然呼吸感动效与类纸排版，营造如书房般的静谧从容</text>

          <!-- Row 2: 信息降维 -->
          <line x1="0" y1="102" x2="870" y2="102" stroke="rgba(0,0,0,0.08)" stroke-width="1" />
          <text x="18" y="88" class="font-ui" font-size="12.5" font-weight="600" fill="#262422">动态信息降维</text>
          <text x="190" y="88" class="font-serif" font-size="12.5" fill="#0A0A0A">建立三层驾驶认知负荷分级（行车安全/辅助感知/休闲沉浸），非必要信息自动折叠</text>

          <!-- Row 3: 触觉阻尼 -->
          <line x1="0" y1="136" x2="870" y2="136" stroke="rgba(0,0,0,0.08)" stroke-width="1" />
          <text x="18" y="122" class="font-ui" font-size="12.5" font-weight="600" fill="#262422">触觉与实体阻尼</text>
          <text x="190" y="122" class="font-serif" font-size="12.5" fill="#0A0A0A">保留核心驾驶按键的物理机械段落阻尼，拒绝“全触控自嗨”，保障行车盲操安全</text>

          <!-- Row 4: 智能体协同 -->
          <line x1="0" y1="170" x2="870" y2="170" stroke="rgba(0,0,0,0.08)" stroke-width="1" />
          <text x="18" y="156" class="font-ui" font-size="12.5" font-weight="600" fill="#262422">多模态智能体</text>
          <text x="190" y="156" class="font-serif" font-size="12.5" fill="#0A0A0A">副驾专注灵感陪伴与长文处理，主屏回归极简导航，全链路指令毫秒级端侧响应</text>

          <!-- Row 5: 品牌心智 -->
          <line x1="0" y1="204" x2="870" y2="204" stroke="rgba(0,0,0,0.08)" stroke-width="1" />
          <text x="18" y="190" class="font-ui" font-size="12.5" font-weight="600" fill="#262422">品牌心智跃迁</text>
          <text x="190" y="190" class="font-serif" font-size="12.5" fill="#0A0A0A">由“功能炫技”（Point A）跃迁至“从容掌控”（Point B），赋予用户深层精神松弛感</text>

          <!-- Row 6: 视觉系统 -->
          <text x="18" y="224" class="font-ui" font-size="12.5" font-weight="600" fill="#262422">视觉资产系统</text>
          <text x="190" y="224" class="font-serif" font-size="12.5" fill="#0A0A0A">温润大地色系底色，搭配典雅衬线标题与等宽排版，形成极具辨识度的人文资产</text>
        </g>

        <!-- Subsection: 💡 为什么拒绝“全触控自嗨”？它的商业本质是什么？ -->
        <g transform="translate(0, 354)">
          <text x="0" y="14" class="font-ui" font-size="13.5" font-weight="600" fill="#0A0A0A">💡 为什么拒绝“全触控自嗨”？它的商业本质是什么？</text>
          <text x="0" y="38" class="font-serif" font-size="13" fill="#4A4642">真正的豪华在于克制与留白。尊崇感从不是把屏幕做大，而是对驾驶者注意力的尊重与物理机械质感的无缝回响。</text>
        </g>

        <!-- Message Actions Footer: 4m ago + copy/thumbs icons -->
        <g transform="translate(0, 420)">
          <text x="760" y="14" class="font-ui" font-size="12" fill="#7A7670">4 分钟前</text>
          <!-- Copy icon -->
          <rect x="815" y="2" width="13" height="13" rx="2" fill="transparent" stroke="#7A7670" stroke-width="1.2" />
          <!-- Thumb up / down -->
          <text x="836" y="14" class="font-ui" font-size="12" fill="#7A7670">👍</text>
          <text x="856" y="14" class="font-ui" font-size="12" fill="#7A7670">👎</text>
        </g>
      </g>

      <!-- Scroll to Bottom Button (悬浮向下箭头) -->
      <g transform="translate(790, 675)">
        <circle cx="16" cy="16" r="16" fill="#FFF" stroke="rgba(0,0,0,0.18)" stroke-width="1" />
        <text x="16" y="21" class="font-ui" font-size="14" font-weight="700" fill="#4A4642" text-anchor="middle">↓</text>
      </g>

      <!-- ========================================== -->
      <!-- 4. BOTTOM INPUT BOX (agentSidePanelInputBox) -->
      <!-- 1:1 严格还原官方截图的大圆角悬浮居中输入框 -->
      <!-- ========================================== -->
      <g transform="translate(420, 715)">
        <rect x="0" y="0" width="870" height="106" rx="14" fill="#F9F7F2" stroke="rgba(0,0,0,0.36)" stroke-width="1" />
        
        <!-- Input Text / Placeholder (汉化: 向智能体提问，键入 @ 引用上下文...) -->
        <text x="24" y="36" class="font-ui" font-size="13.5" font-weight="450" fill="#7A7670">向智能体提问，键入 @ 引用上下文，键入 / 调出快捷操作</text>
        
        <!-- Bottom Controls Bar -->
        <g transform="translate(20, 68)">
          <!-- Left: + Button -->
          <rect x="0" y="0" width="26" height="26" rx="5" fill="#ECE9E1" stroke="rgba(0,0,0,0.2)" stroke-width="0.8" />
          <text x="13" y="17" class="font-ui" font-size="15" font-weight="600" fill="#0A0A0A" text-anchor="middle">＋</text>

          <!-- Model Selector Dropdown (Gemini 4 Argon High ˄) -->
          <g transform="translate(36, 0)">
            <rect x="0" y="0" width="186" height="26" rx="5" fill="#ECE9E1" stroke="rgba(0,0,0,0.24)" stroke-width="0.8" />
            <text x="12" y="17" class="font-ui" font-size="12" font-weight="700" fill="#1A73E8">✦</text>
            <text x="26" y="17" class="font-ui" font-size="12" font-weight="650" fill="#0A0A0A">Gemini 4 Argon High</text>
            <text x="172" y="17" class="font-ui" font-size="10" font-weight="700" fill="#4A4642">˄</text>
          </g>

          <!-- Right: Mode Selector & Send Button -->
          <g transform="translate(680, 0)">
            <!-- Review / Turbo Mode Dropdown (汉化: 🛡 极速模式 ˄ / 请求审查) -->
            <rect x="0" y="0" width="112" height="26" rx="5" fill="#ECE9E1" stroke="rgba(0,0,0,0.24)" stroke-width="0.8" />
            <text x="12" y="17" class="font-ui" font-size="11.5" fill="#0A0A0A">🛡</text>
            <text x="28" y="17" class="font-ui" font-size="12" font-weight="600" fill="#0A0A0A">请求审查</text>
            <text x="96" y="17" class="font-ui" font-size="10" font-weight="700" fill="#4A4642">˄</text>

            <!-- Send Button (Circle Arrow →) -->
            <circle cx="136" cy="13" r="13" fill="#0A0A0A" />
            <text x="136" y="18" class="font-ui" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">→</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>