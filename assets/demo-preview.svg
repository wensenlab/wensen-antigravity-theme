      <line x1="20" y1="765" x2="240" y2="765" stroke="rgba(0,0,0,0.08)" stroke-width="1" />
      <text x="32" y="792" class="font-ui" font-size="12.5" font-weight="480" fill="#262422">⚙️ 系统设置 (Settings)</text>
      <text x="32" y="814" class="font-ui" font-size="11" font-weight="500" fill="#7A7670">WenSenLab · 文森策</text>
    </g>

    <!-- MAIN CHAT AREA -->
    <g id="main-chat">
      <!-- Navbar -->
      <rect x="250" y="52" width="810" height="48" fill="#FCFCFB" />
      <line x1="250" y1="100" x2="1060" y2="100" stroke="rgba(0,0,0,0.08)" stroke-width="1" />

      <text x="272" y="81" class="font-ui" font-size="14" font-weight="650" fill="#1F1E1D">智能座舱品牌定位推演与心智反切</text>
      
      <!-- Status Badge -->
      <rect x="495" y="66" width="180" height="24" rx="12" fill="#F4F1EA" stroke="rgba(0,0,0,0.15)" stroke-width="1" />
      <circle cx="508" cy="78" r="3.5" fill="#27C93F" />
      <text x="518" y="82" class="font-ui" font-size="11.5" font-weight="500" fill="#2C2B29">默认模式 (敏感操作前询问)</text>

      <!-- Right Action Chips -->
      <g transform="translate(770, 65)">
        <rect x="0" y="0" width="112" height="26" rx="5" fill="#F7F5F0" stroke="rgba(0,0,0,0.18)" stroke-width="1" />
        <text x="56" y="17" class="font-ui" font-size="11.5" font-weight="550" fill="#262422" text-anchor="middle">✨ Gemini 2.5 Pro ▾</text>

        <rect x="120" y="0" width="94" height="26" rx="5" fill="#F7F5F0" stroke="rgba(0,0,0,0.18)" stroke-width="1" />
        <text x="167" y="17" class="font-ui" font-size="11.5" font-weight="550" fill="#262422" text-anchor="middle">代码审查 (Review)</text>

        <rect x="222" y="0" width="62" height="26" rx="5" fill="#F7F5F0" stroke="rgba(0,0,0,0.18)" stroke-width="1" />
        <text x="253" y="17" class="font-ui" font-size="11.5" font-weight="550" fill="#262422" text-anchor="middle">🐝 蜂群</text>
      </g>

      <!-- Messages Stream -->
      <!-- User Prompt -->
      <g transform="translate(560, 118)">
        <text x="475" y="0" class="font-ui" font-size="11.5" font-weight="500" fill="#7A7670" text-anchor="end">文森策 · 刚才</text>
        <rect x="0" y="8" width="475" height="52" rx="10" fill="#ECE9E1" stroke="rgba(0,0,0,0.18)" stroke-width="1" />
        <text x="18" y="30" class="font-ui" font-size="13" font-weight="480" fill="#1F1E1D">帮我针对新一代智能座舱做一份品牌定位推演，梳理出与传统造车新</text>
        <text x="18" y="48" class="font-ui" font-size="13" font-weight="480" fill="#1F1E1D">势力的差异化四象限与核心价值主张。</text>
