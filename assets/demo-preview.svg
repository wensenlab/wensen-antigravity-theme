        <g transform="translate(44, 76)">
          <rect x="0" y="0" width="715" height="152" rx="6" fill="#FFF" stroke="rgba(0,0,0,0.2)" stroke-width="1" />
          
          <!-- Table Header -->
          <rect x="0" y="0" width="715" height="28" rx="6" fill="#F7F5F0" />
          <line x1="0" y1="28" x2="715" y2="28" stroke="rgba(0,0,0,0.14)" stroke-width="1" />
          <text x="14" y="19" class="font-ui" font-size="11.5" font-weight="650" fill="#262422">定位象限</text>
          <text x="130" y="19" class="font-ui" font-size="11.5" font-weight="650" fill="#262422">核心心智诉求</text>
          <text x="320" y="19" class="font-ui" font-size="11.5" font-weight="650" fill="#262422">代表交互特征</text>
          <text x="535" y="19" class="font-ui" font-size="11.5" font-weight="650" fill="#262422">竞品固有盲区</text>

          <!-- Row 1 (Highlight) -->
