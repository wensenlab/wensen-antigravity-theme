          <line x1="0" y1="69" x2="715" y2="69" stroke="rgba(0,0,0,0.1)" stroke-width="1" />
          <text x="14" y="54" class="font-ui" font-size="12" font-weight="700" fill="#0A0A0A">人文知性空间 ⭐</text>
          <text x="130" y="54" class="font-serif" font-size="12" fill="#0A0A0A">精神松弛 · 知性独处 · 高审美</text>
          <text x="320" y="54" class="font-serif" font-size="12" fill="#0A0A0A">实体旋钮阻尼感 + 苏式留白界面</text>
          <text x="535" y="54" class="font-serif" font-size="12" fill="#0A0A0A">摆脱屏幕参数轰炸与冰冷算法</text>

          <!-- Row 2 -->
          <rect x="1" y="70" width="713" height="40" fill="#FFF" />
          <line x1="0" y1="110" x2="715" y2="110" stroke="rgba(0,0,0,0.1)" stroke-width="1" />
          <text x="14" y="95" class="font-ui" font-size="12" font-weight="550" fill="#2C2B29">数字极客座舱</text>
          <text x="130" y="95" class="font-serif" font-size="12" fill="#4A4642">多屏互联 · 极速算力 · 炫酷交互</text>
          <text x="320" y="95" class="font-serif" font-size="12" fill="#4A4642">3D 渲染动效 · 自动驾驶大屏可视化</text>
          <text x="535" y="95" class="font-serif" font-size="12" fill="#4A4642">缺乏情绪温度，易产生信息疲劳</text>

          <!-- Row 3 -->
          <rect x="1" y="111" width="713" height="40" fill="#FFF" />
          <text x="14" y="136" class="font-ui" font-size="12" font-weight="550" fill="#2C2B29">家用移动影院</text>
          <text x="130" y="136" class="font-serif" font-size="12" fill="#4A4642">大空间 · 娱乐视听 · 全家共享</text>
          <text x="320" y="136" class="font-serif" font-size="12" fill="#4A4642">吸顶折叠屏 · 零重力座椅 · 亲子互动</text>
          <text x="535" y="136" class="font-serif" font-size="12" fill="#4A4642">偏向功能堆叠，缺乏个人精神锚点</text>
        </g>

        <!-- Quote Box -->
        <g transform="translate(44, 238)">
          <rect x="0" y="0" width="715" height="38" rx="4" fill="#F9F7F2" stroke="rgba(0,0,0,0.12)" stroke-width="1" />
          <rect x="0" y="0" width="3.5" height="38" rx="2" fill="#D97757" />
          <text x="16" y="24" class="font-ui" font-size="13" font-weight="650" fill="#0A0A0A">核心单一主张 (SMP)：<tspan font-weight="480" font-family="'Tiempos Text', Georgia, serif">“在奔波的时代里，造一座移动的人文居所。”</tspan></text>
        </g>

        <!-- Strategy Tip -->
        <text x="44" y="296" class="font-ui" font-size="12" fill="#4A4642">💡 策略建议：避开算力数字军备竞赛，将传播锚点锁定在“重获专注与独处的松弛感”，击穿 30-45 岁高净值知性中产心智。</text>
      </g>

      <!-- Bottom Input Box Area -->
